# Projet Xcode généré par xcodegen (le .xcodeproj reste ignoré par git) : `xcodegen generate`.
name: NotchPrompter
options:
  bundleIdPrefix: com.snouzy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: 0.2.1
settings:
  base:
    DEVELOPMENT_TEAM: X46PFJFYKM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  NotchPrompter:
    type: application
    platform: macOS
    sources:
      - path: notch-prompter
      - path: Localizable.xcstrings
    dependencies:
      - package: HotKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snouzy.notchprompter
        PRODUCT_NAME: NotchPrompter
        MARKETING_VERSION: "1.0-studio"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: notch-prompter/NotchPrompter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: notch-prompter/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NotchPrompter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSCameraUsageDescription: "NotchPrompter filme tes passages face caméra pendant que tu lis le texte."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "NotchPrompter enregistre ta voix avec la prise face caméra."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © Jakub Pomykała. Fork personnel (mode studio) de Mathias Bradiceanu, usage non commercial."

  NotchPrompterTests:
    # Tests sans app hôte : rien ne se lance dans la session de Mathias, seul le cœur du mode studio est compilé ici.
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: notch-prompterTests
      - path: notch-prompter/Studio/Core
      - path: notch-prompter/Studio/StudioView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snouzy.notchprompter.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NotchPrompter:
    build:
      targets:
        NotchPrompter: all
        NotchPrompterTests: [test]
    test:
      targets:
        - NotchPrompterTests
